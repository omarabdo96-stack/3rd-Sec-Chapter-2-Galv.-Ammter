<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>System Quest · Galvanometer Physics Lab — MR / OMAR ABD AL HADY</title>
<style>
:root{--bg:#0B0E17;--card:#131826;--cy:#00E5FF;--vi:#9D4EDD;--ok:#39FF88;--bad:#FF3B5C;--amb:#FFC93C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;color:#E8F6FF;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;touch-action:manipulation;-webkit-user-select:none;user-select:none}
body{display:flex;flex-direction:column;height:100dvh;
 background:radial-gradient(circle at 12% 0%,rgba(157,78,221,.28),transparent 45%),radial-gradient(circle at 100% 100%,rgba(0,229,255,.16),transparent 40%),var(--bg)}
header{display:flex;align-items:center;gap:14px;padding:8px 12px 4px}
.logo{height:56px;flex:0 0 auto;animation:pulse 2.6s ease-in-out infinite alternate}
@keyframes pulse{from{filter:drop-shadow(0 0 4px rgba(0,229,255,.5))}to{filter:drop-shadow(0 0 14px rgba(157,78,221,.95))}}
.tabs{flex:1;display:flex;gap:8px;min-width:0}
.tab{flex:1;min-height:56px;min-width:0;cursor:pointer;background:var(--card);color:#9fb6c9;border:3px solid #000;border-radius:8px;
 box-shadow:0 0 0 2px rgba(157,78,221,.7),4px 4px 0 #000;font:900 14px "Trebuchet MS",sans-serif;letter-spacing:.04em;text-transform:uppercase;padding:4px 8px;line-height:1.15}
.tab small{display:block;font-weight:700;font-size:11px;opacity:.8;letter-spacing:.02em;text-transform:none}
.tab.on{color:#001018;background:linear-gradient(135deg,#00E5FF,#8af5ff);box-shadow:0 0 0 2px #00E5FF,0 0 22px #00E5FF,4px 4px 0 #000}
main{flex:1;min-height:0;display:flex;gap:12px;padding:6px 12px 12px}
.stage{flex:1 1 60%;min-width:0;position:relative;border:3px solid #000;border-radius:12px;box-shadow:0 0 0 2px var(--cy),0 0 24px rgba(0,229,255,.4);
 background-color:rgba(8,10,18,.7);background-image:radial-gradient(rgba(157,78,221,.28) 1.3px,transparent 1.7px);background-size:14px 14px;overflow:hidden}
canvas{width:100%;height:100%;display:block}
.side{flex:0 0 clamp(400px,40vw,600px);overflow-y:auto;padding:2px 6px 2px 2px;scrollbar-width:thin;scrollbar-color:var(--vi) transparent}
.panel{display:none}.panel.on{display:block}
.card{background:var(--card);border:3px solid #000;border-radius:10px;padding:12px 14px;margin-bottom:12px;position:relative;
 box-shadow:0 0 0 2px var(--cy),0 0 16px rgba(0,229,255,.4),5px 5px 0 #000}
.card.v{box-shadow:0 0 0 2px var(--vi),0 0 16px rgba(157,78,221,.55),5px 5px 0 #000}
.card h3{margin:-2px 0 8px;font-size:13px;letter-spacing:.12em;color:var(--cy);text-transform:uppercase;text-shadow:0 0 8px rgba(0,229,255,.7)}
.card.v h3{color:#C77DFF;text-shadow:0 0 8px rgba(157,78,221,.8)}
.ctl{margin-bottom:4px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px}
.row label{font-weight:800;letter-spacing:.04em;color:#bcd2e4}
.row b{color:var(--amb);font-size:16px;text-shadow:0 0 8px rgba(255,201,60,.5);white-space:nowrap}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:48px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:14px;border-radius:8px;background:linear-gradient(90deg,var(--vi),var(--cy));border:3px solid #000}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:36px;height:36px;border-radius:50%;background:#fff;border:3px solid #000;margin-top:-11px;box-shadow:0 0 0 3px var(--cy),0 0 14px var(--cy)}
input[type=range]::-moz-range-track{height:8px;border-radius:8px;background:linear-gradient(90deg,var(--vi),var(--cy));border:3px solid #000}
input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid #000;box-shadow:0 0 0 3px var(--cy),0 0 14px var(--cy)}
.lbl{font-size:12px;font-weight:800;letter-spacing:.1em;color:#8fa9c0;margin:8px 0 5px;text-transform:uppercase}
.seg{display:flex;gap:8px}.seg.col{flex-direction:column}
.seg button,.btn{min-height:52px;cursor:pointer;background:#0d1220;color:#9fb6c9;border:3px solid #000;border-radius:8px;padding:6px 10px;
 font:900 13px "Trebuchet MS",sans-serif;letter-spacing:.03em;box-shadow:0 0 0 2px #2a3550,3px 3px 0 #000;text-align:center;line-height:1.2;flex:1}
.btn small{font-weight:700;font-size:11px;opacity:.85;letter-spacing:0}
.seg button.on,.btn.on{background:linear-gradient(135deg,#0a3a48,#2a1450);color:#fff;box-shadow:0 0 0 2px var(--cy),0 0 14px var(--cy),3px 3px 0 #000}
.seg button.on.warn{box-shadow:0 0 0 2px var(--ok),0 0 14px var(--ok),3px 3px 0 #000}
.btn:active,.seg button:active,.tab:active{transform:translate(2px,2px)}
.btn.pre{background:linear-gradient(135deg,#2a1450,#0a3a48);color:#e9d9ff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.meter{display:grid;grid-template-columns:78px 1fr 110px;gap:8px;align-items:center;margin:6px 0;font-size:13px;font-weight:800}
.bar{height:22px;border:3px solid #000;border-radius:6px;background:#0a0e1a;position:relative;overflow:hidden}
.bar:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:#fff6}
.bar i{position:absolute;top:0;bottom:0;left:50%;width:0}
.meter b{text-align:right;font-size:12px;color:#fff}
.status{margin-top:8px;min-height:52px;display:flex;align-items:center;justify-content:center;text-align:center;border:3px solid #000;border-radius:8px;font-weight:900;font-size:14px;letter-spacing:.05em;padding:6px}
.status.move{background:#2b2308;color:var(--amb);box-shadow:0 0 0 2px var(--amb)}
.status.lock{background:#0c3b24;color:var(--ok);box-shadow:0 0 0 2px var(--ok);animation:flash .6s infinite alternate}
.status.peg{background:#3b0c18;color:var(--bad);box-shadow:0 0 0 2px var(--bad);animation:flash .35s infinite alternate}
@keyframes flash{from{filter:brightness(.8)}to{filter:brightness(1.5);box-shadow:0 0 22px currentColor}}
.rule{display:flex;gap:10px;align-items:flex-start;background:#0d1220;border:2px solid #000;border-radius:8px;padding:8px 10px;margin:7px 0;font-size:13px;line-height:1.5;box-shadow:inset 0 0 0 1px #2a3550}
.rule .idx{flex:0 0 auto;min-width:30px;height:30px;border-radius:6px;background:linear-gradient(135deg,var(--cy),var(--vi));color:#001018;font-weight:900;display:flex;align-items:center;justify-content:center;border:2px solid #000;padding:0 4px;font-size:13px}
.rule b.t{color:var(--cy)}
.rule code{font-family:Consolas,"Courier New",monospace;color:#fff;font-size:12.5px}
.ok{color:var(--ok);font-weight:900}.bad{color:var(--bad);font-weight:900}.amb{color:var(--amb);font-weight:900}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
th,td{border:2px solid #000;padding:5px 6px;text-align:center;background:#0d1220}th{color:var(--cy);font-size:11px}
.note{font-size:12.5px;line-height:1.45;color:#a9c0d4;margin:6px 0 2px}
@media (max-width:900px){main{flex-direction:column;overflow-y:auto}.stage{flex:0 0 55vw}.side{flex:0 0 auto;overflow:visible}header{flex-wrap:wrap}}
</style>
</head>
<body>
<header>
 <svg class="logo" viewBox="0 0 470 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="System Quest badge: MR / OMAR ABD AL HADY • PHYSICS LAB">
  <defs>
   <linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#00E5FF"/><stop offset="1" stop-color="#9D4EDD"/></linearGradient>
   <filter id="glow" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g filter="url(#glow)">
   <polygon points="12,3 458,3 467,13 467,51 458,61 12,61 3,51 3,13" fill="#0a0f20" stroke="url(#lg)" stroke-width="3"/>
   <polygon points="12,3 60,3 40,61 12,61 3,51 3,13" fill="#00E5FF" opacity=".12"/>
   <text x="16" y="21" font-family="Trebuchet MS,Arial,sans-serif" font-size="11" font-weight="900" fill="#00E5FF" letter-spacing="3">◆ SYSTEM QUEST ◆ PLAYER ONLINE</text>
   <text x="16" y="48" font-family="Trebuchet MS,Arial,sans-serif" font-size="21" font-weight="900" fill="#fff" stroke="#000" stroke-width="4" paint-order="stroke" textLength="438" lengthAdjust="spacingAndGlyphs">MR / OMAR ABD AL HADY • PHYSICS LAB</text>
  </g>
 </svg>
 <nav class="tabs">
  <button class="tab on" data-tab="1">① Torque &amp; Polarity<small>Galvanometer Lab · Pages 1–6</small></button>
  <button class="tab" data-tab="2">② Sensitivity &amp; Range<small>S = θ / I · Pages 7–14</small></button>
  <button class="tab" data-tab="3">③ Ammeter Shunt<small>Magic Rules · Pages 15–28</small></button>
 </nav>
</header>
<main>
 <section class="stage"><canvas id="cv"></canvas></section>
 <aside class="side">
  <div id="p1" class="panel on"></div>
  <div id="p2" class="panel"></div>
  <div id="p3" class="panel"></div>
 </aside>
</main>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const TAU=Math.PI*2,D2R=Math.PI/180,R2D=180/Math.PI;
const fmt=(v,d=2)=>Number(v).toFixed(d);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
function sl(id,label,min,max,step,val){return `<div class="ctl"><div class="row"><label for="${id}">${label}</label><b id="${id}V"></b></div><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"></div>`}

/* ============ CANVAS ============ */
const cv=$('cv'),ctx=cv.getContext('2d');
const VW=1000,VH=620;let K=1,scl=1,ox=0,oy=0;
function resize(){const r=cv.parentElement.getBoundingClientRect();K=window.devicePixelRatio||1;cv.width=Math.max(1,r.width*K);cv.height=Math.max(1,r.height*K);scl=Math.min(r.width/VW,r.height/VH);ox=(r.width-VW*scl)/2;oy=(r.height-VH*scl)/2}
function beginFrame(){ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.setTransform(K*scl,0,0,K*scl,K*ox,K*oy);ctx.setLineDash([]);ctx.shadowBlur=0;ctx.globalAlpha=1}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function ink(fill,lw=3){if(fill){ctx.fillStyle=fill;ctx.fill()}ctx.lineWidth=lw;ctx.strokeStyle='#000';ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke()}
function txt(s,x,y,size,col,al='center',ol=true){ctx.font=`900 ${size}px "Trebuchet MS","Segoe UI",sans-serif`;ctx.textAlign=al;ctx.textBaseline='middle';
 if(ol){ctx.lineWidth=Math.max(3,size*.22);ctx.strokeStyle='#000';ctx.lineJoin='round';ctx.strokeText(s,x,y)}ctx.fillStyle=col;ctx.fillText(s,x,y)}
function panelBox(x,y,w,h,title,col='#00E5FF'){rr(x,y,w,h,14);ctx.fillStyle='rgba(16,21,35,.93)';ctx.fill();
 ctx.save();ctx.shadowColor=col;ctx.shadowBlur=14;ctx.lineWidth=2.5;ctx.strokeStyle=col;ctx.stroke();ctx.restore();
 if(title)txt(title,x+w/2,y+22,14,col,'center')}
function arrow(x1,y1,x2,y2,col,w=6){const a=Math.atan2(y2-y1,x2-x1),hl=19,hw=12,ca=Math.cos(a),sa=Math.sin(a);
 const bx=x2-ca*hl*.7,by=y2-sa*hl*.7;
 ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(bx,by);ctx.lineWidth=w+6;ctx.strokeStyle='#000';ctx.lineCap='round';ctx.stroke();
 ctx.beginPath();ctx.moveTo(x2+ca*2,y2+sa*2);ctx.lineTo(x2-ca*hl+sa*hw,y2-sa*hl-ca*hw);ctx.lineTo(x2-ca*hl-sa*hw,y2-sa*hl+ca*hw);ctx.closePath();ink(col,3);
 ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(bx,by);ctx.lineWidth=w;ctx.strokeStyle=col;ctx.stroke()}

/* particle FX: sparks + smoke */
function newFx(){return{sp:[],sm:[],acc:0}}
function fxEmit(fx,x,y,dt){fx.acc+=dt*70;while(fx.acc>1){fx.acc--;const a=rnd(0,TAU),v=rnd(80,280);
 fx.sp.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-80,l:rnd(.25,.6),m:.6});
 if(Math.random()<.5)fx.sm.push({x:x+rnd(-8,8),y,vx:rnd(-14,14),vy:-rnd(35,80),r:rnd(6,10),l:1.6,m:1.6})}}
function fxUpdate(fx,dt){for(const p of fx.sp){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=380*dt;p.l-=dt}
 for(const p of fx.sm){p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=22*dt;p.l-=dt}
 fx.sp=fx.sp.filter(p=>p.l>0);fx.sm=fx.sm.filter(p=>p.l>0)}
function fxDraw(fx){for(const p of fx.sm){ctx.globalAlpha=clamp(p.l/p.m,0,1)*.55;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fillStyle='#8b8f9c';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#000';ctx.stroke()}
 ctx.globalAlpha=1;ctx.save();ctx.shadowColor='#FFB020';ctx.shadowBlur=10;ctx.lineCap='round';
 for(const p of fx.sp){ctx.globalAlpha=clamp(p.l/p.m,0,1);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*.04,p.y-p.vy*.04);ctx.lineWidth=3;ctx.strokeStyle=Math.random()<.5?'#FFE066':'#FF7A1A';ctx.stroke()}
 ctx.restore();ctx.globalAlpha=1}

/* ============ TAB 1 : TORQUE LAB ============ */
const A_COIL=6e-4,J_INERT=2e-5,LIM=1.48;
const T1={I:15,conc:true,iron:true,N:200,k:8.6,th:0,w:0,hold:0,tmag:0,tsp:0,status:'move',B:.25,f:1};
$('p1').innerHTML=`
<div class="card"><h3>◈ System Controls — Torque Lab</h3>
 ${sl('s1I','DC CURRENT (I)',-30,30,0.5,15)}
 ${sl('s1N','COIL TURNS (N)',50,500,10,200)}
 ${sl('s1k','SPIRAL SPRING STIFFNESS (k)',4,20,0.1,8.6)}
 <div class="lbl">Magnet pole geometry</div>
 <div class="seg col" data-id="pole">
  <button data-v="conc" class="on">CONCAVE POLES (Radial Uniform Flux, θ = 90°)</button>
  <button data-v="flat">FLAT POLES (Non-uniform angle)</button></div>
 <div class="lbl">Soft iron core</div>
 <div class="seg col" data-id="core">
  <button data-v="iron" class="on">WITH IRON CORE (High Permeability μ → Boosts B)</button>
  <button data-v="air">AIR CORE</button></div>
</div>
<div class="card v"><h3>◈ Live Torque Equilibrium Meter</h3>
 <div class="meter"><span style="color:#39FF88">τ_mag</span><div class="bar"><i id="barMag" style="background:#39FF88"></i></div><b id="tMag"></b></div>
 <div class="meter"><span style="color:#FF9F1C">τ_spring</span><div class="bar"><i id="barSp" style="background:#FF9F1C"></i></div><b id="tSp"></b></div>
 <div class="meter"><span style="color:#C77DFF">NET τ</span><div class="bar"><i id="barNet" style="background:#C77DFF"></i></div><b id="tNet"></b></div>
 <div id="eq" class="status move"></div>
</div>
<div class="card"><h3>◈ Live Equations</h3><div id="eqs1"></div></div>`;

const seg1={pole:v=>{T1.conc=v==='conc'},core:v=>{T1.iron=v==='iron'}};
function bindSl1(){
 const map=[['s1I',v=>{T1.I=v},v=>(v>0?'+':'')+fmt(v,1)+' mA'],['s1N',v=>{T1.N=v},v=>v+' turns'],['s1k',v=>{T1.k=v},v=>fmt(v,1)+' ×10⁻⁴ N·m/rad']];
 map.forEach(([id,fn,lab])=>{const el=$(id);const upd=()=>{fn(parseFloat(el.value));$(id+'V').textContent=lab(parseFloat(el.value))};el.addEventListener('input',upd);upd()});
}
function step1(dt){
 const B=T1.iron?.25:.10,I=T1.I/1000,k=T1.k*1e-4,c=2*.45*Math.sqrt(k*J_INERT);
 const n=Math.max(1,Math.ceil(dt/.004)),h=dt/n;
 for(let i=0;i<n;i++){const f=T1.conc?1:Math.cos(T1.th);const tm=B*I*A_COIL*T1.N*f;const a=(tm-k*T1.th-c*T1.w)/J_INERT;
  T1.w+=a*h;T1.th+=T1.w*h;
  if(T1.th>LIM){T1.th=LIM;if(T1.w>0)T1.w=0}if(T1.th<-LIM){T1.th=-LIM;if(T1.w<0)T1.w=0}}
 T1.B=B;T1.f=T1.conc?1:Math.cos(T1.th);T1.tmag=B*I*A_COIL*T1.N*T1.f;T1.tsp=k*T1.th;
 const net=T1.tmag-T1.tsp,sc=Math.max(Math.abs(T1.tmag),Math.abs(T1.tsp),3e-5);
 const settled=Math.abs(T1.w)<.04&&Math.abs(net)<.03*sc;T1.hold=settled?T1.hold+dt:0;
 T1.status=(Math.abs(T1.th)>=LIM-.002&&Math.abs(net)>.03*sc)?'peg':(T1.hold>.3?'lock':'move')}
function setBar(id,v){const p=clamp(Math.abs(v)/1.2e-3,0,1)*50,e=$(id);e.style.width=p+'%';e.style.left=(v>=0?50:50-p)+'%'}
function hud1(){
 const net=T1.tmag-T1.tsp,tq=v=>fmt(v*1e4,2)+' ×10⁻⁴';
 $('tMag').textContent=tq(T1.tmag);$('tSp').textContent=tq(T1.tsp);$('tNet').textContent=tq(net);
 setBar('barMag',T1.tmag);setBar('barSp',T1.tsp);setBar('barNet',net);
 const e=$('eq'),st=T1.status;e.className='status '+st;
 e.textContent=st==='lock'?'✔ EQUILIBRIUM LOCKED: NET TORQUE = 0':st==='peg'?'⚠ POINTER PEGGED AT STOP — REDUCE I OR N':'… NEEDLE MOVING: τ_mag ≠ τ_spring';
 const th=T1.th*R2D,phi=T1.conc?90:90-Math.abs(th),I=T1.I/1000;
 const pol=T1.I>0?'POSITIVE → needle right of zero':T1.I<0?'NEGATIVE → needle left of zero (center-zero scale!)':'ZERO current → needle at 0';
 $('eqs1').innerHTML=`
 <div class="rule"><span class="idx">τm</span><div><b class="t">τ_mag = B·I·A·N·sin φ</b><br><code>${fmt(T1.B,2)} × ${fmt(I,4)} × 6.0e-4 × ${T1.N} × ${fmt(Math.sin(phi*D2R),3)} = ${fmt(T1.tmag*1e4,3)}×10⁻⁴ N·m</code><br>B = ${fmt(T1.B,2)} T ${T1.iron?'(iron core ×2.5)':'(air core)'} · φ = ${fmt(phi,1)}° ${T1.conc?'(radial field ⇒ sin φ = 1 always)':'(flat: sin φ = cos θ ⇒ torque shrinks as coil turns)'}</div></div>
 <div class="rule"><span class="idx">τs</span><div><b class="t">τ_spring = k·θ</b><br><code>${fmt(T1.k,1)}×10⁻⁴ × ${fmt(T1.th,3)} rad = ${fmt(T1.tsp*1e4,3)}×10⁻⁴ N·m</code><br>Equilibrium when τ_mag = τ_spring ⇒ ${T1.conc?'θ = B·I·A·N / k':'k·θ = B·I·A·N·cos θ'}</div></div>
 <div class="rule"><span class="idx">θ</span><div>Deflection θ = <b class="amb">${fmt(th,1)}°</b> · Force on each coil side F = B·I·L·N<br>Dial reads <b class="amb">${fmt(th/2,1)} mA</b> (scale calibrated for default device: 2°/mA)<br><span class="${T1.I===0?'':'ok'}">${pol}</span></div></div>`;
}

function drawFlux(cx,cy,t){
 const iron=T1.iron,conc=T1.conc,Rc=52,Rp=96;
 ctx.save();ctx.lineCap='round';ctx.strokeStyle='#00E5FF';ctx.shadowColor='#00E5FF';ctx.shadowBlur=10;
 ctx.lineWidth=iron?3.4:2;ctx.globalAlpha=iron?.95:.6;ctx.setLineDash([12,9]);ctx.lineDashOffset=-t*45;
 const ln=(a,b,c,d)=>{ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.stroke()};
 if(conc&&iron){const n=9,a=.8;for(let i=0;i<n;i++){const f=-a+2*a*i/(n-1);
  let an=Math.PI+f;ln(cx+Math.cos(an)*(Rp-2),cy+Math.sin(an)*(Rp-2),cx+Math.cos(an)*(Rc+3),cy+Math.sin(an)*(Rc+3));
  an=f;ln(cx+Math.cos(an)*(Rc+3),cy+Math.sin(an)*(Rc+3),cx+Math.cos(an)*(Rp-2),cy+Math.sin(an)*(Rp-2))}}
 else if(!conc&&iron){for(let i=0;i<9;i++){const yo=-85+170*i/8,d=Math.hypot(100,yo),ux=-100/d,uy=yo/d;
  ln(cx-98,cy+yo,cx+ux*(Rc+3),cy+uy*(Rc+3));ln(cx-ux*(Rc+3),cy+uy*(Rc+3),cx+98,cy+yo)}}

 <code>R_g = (${fmt(nR,2)}−1) × ${fmt(s.Rs,2)} = ${fmt((nR-1)*s.Rs,2)} Ω</code> · I_g/I = <b class="amb">${fmt(100*(cl?c.Iga/Math.max(s.I,1e-9):1),1)}%</b><br>
 ${cl?`Range ×${fmt(c.n,2)} ⇒ Max I = n·I_g = <b class="amb">${fmt(c.range,3)} A</b>`:'<span class="amb">Shunt open: n = 1, range = I_g</span>'}</div></div>
 <div class="rule"><span class="idx">4</span><div><b class="t">Total Ammeter Resistance: R_A = (R_g·R_s)/(R_g+R_s)</b><br>
 <code>(${fmt(s.Rg,1)} × ${fmt(s.Rs,2)}) / (${fmt(s.Rg,1)} + ${fmt(s.Rs,2)}) = ${fmt(s.Rg*s.Rs/(s.Rg+s.Rs),3)} Ω</code> ${cl?'<span class="ok">R_A &lt; R_s &lt; R_g</span>':'<span class="amb">(open: R_A = R_g)</span>'}</div></div>
 <div class="rule"><span class="idx">5</span><div><b class="t">New Ammeter Sensitivity: S_ammeter = S_galv / n</b><br>
 <code>S_galv = 90° / ${fmt(s.Ig,3)} A = ${fmt(Sg,1)} °/A</code><br><code>S_ammeter = ${fmt(Sg,1)} / ${fmt(c.n,2)} = ${fmt(Sg/c.n,2)} °/A</code> (${fmt(100/c.n,1)}% of original)</div></div>
 ${c.over?'<div class="status peg">⚠ GALVANOMETER OVERLOAD — I_g EXCEEDS I_g(max)! '+(cl?'Lower R_s or reduce I.':'Close the shunt switch!')+'</div>':`<div class="status ${cl?'lock':'move'}" style="animation:none">${cl?'✔ COIL PROTECTED — SHUNT TAKES '+fmt(100*c.Is/Math.max(s.I,1e-9),1)+'% OF I':'… SHUNT OPEN — ALL CURRENT FLOWS THROUGH THE COIL'}</div>`}`}

document.addEventListener('click',e=>{const b=e.target.closest('.seg button');if(!b)return;const sg=b.parentElement,id=sg.dataset.id;
 if(id==='pole'||id==='core'||id==='sw'){sg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
  if(id==='sw'){setSwitch(b.dataset.v);document.querySelectorAll('[data-p]').forEach(x=>x.classList.remove('on'))}else seg1[id](b.dataset.v)}});
let tab=1;
function hud(){tab===1?hud1():tab===2?hud2():hud3()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=+b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));
 for(let i=1;i<=3;i++)$('p'+i).classList.toggle('on',i===tab);document.querySelector('.side').scrollTop=0;resize();hud()});
bindSl1();bind2();bind3();resize();window.addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe(cv.parentElement);
let last=performance.now(),acc=0,T=0;
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;acc+=dt;
 beginFrame();
 if(tab===1){step1(dt);draw1(T)}else if(tab===2){step2(dt);draw2(T)}else{step3(dt);draw3(T)}
 if(acc>.06){acc=0;hud()}
 requestAnimationFrame(loop)}
hud();requestAnimationFrame(loop);
})();
